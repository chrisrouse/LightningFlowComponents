<template>
    <!-- The icon-colour hook is set HERE, on our own host, and nothing else
         does anything about icons. CSS custom properties inherit THROUGH a
         shadow boundary where a selector cannot cross it, so if the datatable's
         icons come out purple, colour can reach inside with no static resource
         at all. The component Flow Grid replaces uses this same hook for its
         remove-row icon. -->
    <div class="slds-card slds-p-around_medium probe" style="--slds-c-icon-color-foreground: #9050e9">
        <h2 class="slds-text-heading_medium slds-m-bottom_xx-small">Datatable cell colour probe — round 2</h2>
        <p class="slds-text-body_small slds-m-bottom_xx-small">{styleStatus}</p>
        <p class="slds-text-body_small slds-m-bottom_small">
            <strong>Hover the rows.</strong> The bug is a hovered themed cell keeping its white text while the row
            hover repaints the background underneath it. <code>slds-theme_success</code> and
            <code>slds-theme_error</code> also carry a hover fix from the global stylesheet; the other themed rows do
            not. Compare them under the cursor.
        </p>

        <lightning-datatable
            key-field="id"
            columns={columns}
            data={data}
            hide-checkbox-column
            column-widths-mode="auto"
        ></lightning-datatable>

        <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_x-small">
            The six native colours, in our own markup — the Option B comparison
        </h3>
        <div class="swatches">
            <span class="swatch swatch_gray">Gray</span>
            <span class="swatch swatch_blue">Blue</span>
            <span class="swatch swatch_green">Green</span>
            <span class="swatch swatch_orange">Orange</span>
            <span class="swatch swatch_red">Red</span>
            <span class="swatch swatch_purple">Purple</span>
        </div>
    </div>
</template>
