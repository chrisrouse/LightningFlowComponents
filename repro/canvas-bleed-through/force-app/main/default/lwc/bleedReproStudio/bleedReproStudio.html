<template>
    <lightning-modal-header label="Studio Modal"></lightning-modal-header>

    <lightning-modal-body>
        <p class="slds-text-body_small slds-m-bottom_medium">
            Native lightning/modal at size medium. No custom CSS anywhere in this project. Looking for the canvas chip
            and the flow connector lines painting OVER this modal.
        </p>

        <lightning-button
            label="Identify Element at Click"
            onclick={handleArmHitTest}
            class="slds-m-bottom_medium"
        ></lightning-button>

        <lightning-combobox
            label="Focus and Blur This"
            value="one"
            options={comboOptions}
            class="slds-m-bottom_medium"
        ></lightning-combobox>

        <lightning-datatable
            key-field="id"
            columns={columns}
            data={rows}
            hide-checkbox-column
        ></lightning-datatable>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button label="Close" onclick={handleClose}></lightning-button>
    </lightning-modal-footer>
</template>
