<template>
    <lightning-modal-header label="Studio Modal"></lightning-modal-header>

    <lightning-modal-body>
        <p class="slds-text-body_small slds-m-bottom_medium">
            Native lightning/modal, size {sizeLabel}. Looking for the canvas chip and connector lines painting OVER this
            modal, and for how much width a two-pane workspace actually gets.
        </p>

        <div class="slds-m-bottom_medium">
            <lightning-button
                label="Identify Element at Click"
                onclick={handleArmHitTest}
                class="slds-m-right_x-small"
            ></lightning-button>
            <lightning-button label="Measure Width" onclick={handleMeasure}></lightning-button>
            <span class="slds-m-left_small slds-text-body_small slds-text-color_weak">{measurement}</span>
        </div>

        <!--
            Mimics the real Studio: a fixed-width left pane of controls beside a
            preview that has to fit a datatable. The wrapper asks for 60rem, which is
            the real component's min-width, to see whether the platform container
            grows to it or the content just overflows.
        -->
        <div class="two-pane">
            <div class="left-pane">
                <lightning-combobox label="Object" value="one" options={comboOptions}></lightning-combobox>
                <lightning-combobox label="Row Loading" value="one" options={comboOptions}></lightning-combobox>
                <lightning-input label="Records Per Page" type="number" value="10"></lightning-input>
            </div>
            <div class="right-pane">
                <lightning-datatable
                    key-field="id"
                    columns={columns}
                    data={rows}
                    hide-checkbox-column
                ></lightning-datatable>
            </div>
        </div>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button label="Close" onclick={handleClose}></lightning-button>
    </lightning-modal-footer>
</template>
