<template>
    <template lwc:if={disabled}>
        <!-- A stand-in, not the real picker: the kit input cannot be
             disabled, so it is replaced rather than dressed up. Read-only by
             construction, and it keeps the label and help text so the row
             looks the same as when it is available. -->
        <lightning-input
            label={label}
            value={displayValue}
            field-level-help={fieldLevelHelp}
            disabled
        ></lightning-input>
    </template>

    <template lwc:else>
        <c-flow-config-value-input
            label={label}
            property-name={propertyName}
            value={value}
            value-data-type={valueDataType}
            value-type={valueType}
            required={required}
            placeholder={placeholder}
            field-level-help={fieldLevelHelp}
            builder-context={builderContext}
            automatic-output-variables={automaticOutputVariables}
            api-version={apiVersion}
            onvaluechange={handleValueChange}
        ></c-flow-config-value-input>
    </template>
</template>
